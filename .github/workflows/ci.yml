name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.20.x', cache: true}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./...
      - run: go build ./cmd/sentineld ./cmd/sentinel
      - run: go test ./test/integration -count=1
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: ./packaging/debian/build.sh
      - run: dpkg-deb --info packaging/debian/out/*.deb
