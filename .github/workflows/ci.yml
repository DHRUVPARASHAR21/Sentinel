name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # Pin the toolchain to the latest Go 1.25 security release. Sentinel
        # has no module dependencies, so setup-go has no go.sum cache key.
        with: {go-version: '1.25.13', cache: false}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./...
      - run: go build ./cmd/sentineld ./cmd/sentinel
      - run: go test ./test/integration -count=1
      # v1.2.0 is the newest govulncheck release compatible with the Go 1.25
      # toolchain. Keep the scanner pinned so a future toolchain requirement
      # does not turn an otherwise healthy CI run into an infrastructure error.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.2.0 ./...
      - run: ./packaging/debian/build.sh
      - run: dpkg-deb --info packaging/debian/out/*.deb
